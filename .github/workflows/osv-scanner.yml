name: OSV Scanner

# Vulnerability scanner (OSV.dev) — replaces GHAS Dependency Review.
# Binary-based invocation — the google/osv-scanner-action namespace has
# unstable/versioned tags that break `@v2`; running the binary is the
# cheapest path that also avoids third-party action pinning.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout pinned to v4.2.2 SHA (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          VER=2.0.2
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${VER}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan
        # v2 CLI: `scan source` is the subcommand; -r walks subdirs.
        run: osv-scanner scan source -r .
