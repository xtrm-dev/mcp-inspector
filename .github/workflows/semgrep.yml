name: Semgrep

# SAST (free CodeQL substitute). Diff-aware on PRs (only NEW findings vs base).
# No push trigger — `semgrep ci` has no baseline on push and would re-flag debt.

on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/default
            p/security-audit
            p/secrets
            p/typescript
            p/javascript
            p/nodejs
            p/github-actions
