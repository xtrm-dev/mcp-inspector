# Pre-commit — local mirror of CI. Two stages: commit (fast) and push (heavy).
# Chained from .githooks/pre-commit and .githooks/pre-push (core.hooksPath),
# so `pre-commit install` is NOT used.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (push, diff-only vs origin/dev)
        stages: [pre-push]
        language: system
        pass_filenames: false
        entry: ./scripts/semgrep-diff.sh

      - id: osv-scanner
        name: osv-scanner (push)
        stages: [pre-push]
        language: system
        pass_filenames: false
        entry: bash -c 'if command -v osv-scanner >/dev/null; then osv-scanner --recursive ./; else echo "osv-scanner not installed locally — skipping (CI covers it)"; fi'
