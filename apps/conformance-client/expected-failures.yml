# MCP Conformance — expected-failures baseline for the full 2026-07-28
# requirements set. Every entry is a scenario:check-id string (no space
# after the colon — the harness rejects mapping form).
#
# This is a snapshot of what MCP Inspector X's slice-7 adapter does NOT
# yet implement. Entries should shrink over time, not grow. If a scenario
# starts passing while listed here, the conformance harness exits 1 with
# a "stale baseline" message — remove the entry, don't extend it.
#
# Auth flows (OAuth 2.1 client, DCR, DPoP, WIF, offline_access, iss/issuer
# validation) are not part of slice 7 — the adapter has no OAuthProvider
# wired. The scoreboard job is `continue-on-error: true` so unbaselined
# regressions there stay visible without blocking merges.

