name: Gitleaks

# Backstop for committed secrets. Push protection is the primary gate;
# this catches history and anything pushed --no-verify.
# CLI-based invocation — the gitleaks/gitleaks-action requires a paid
# licence for org accounts.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout pinned to v4.2.2 SHA (supply-chain hardening).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repo
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
