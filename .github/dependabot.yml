# Dependabot — npm monorepo + GitHub Actions. PRs target `dev` (default).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Wait a few days after a version publishes before proposing an update,
    # so freshly-compromised releases don't auto-PR straight in.
    cooldown:
      default-days: 5
      semver-major-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 3
    labels: [dependencies, github-actions]
    groups:
      actions-all:
        patterns: ["*"]
    cooldown:
      default-days: 5
      semver-major-days: 14
